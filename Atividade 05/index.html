<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atividade 5 - JavaScript Avançado</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      padding: 40px;
      max-width: 600px;
      margin: auto;
    }

    h1 {
      color: #2c3e50;
    }

    input, button {
      padding: 10px;
      margin: 10px 0;
      width: 100%;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #3498db;
      color: white;
      cursor: pointer;
      border: none;
    }

    button:hover {
      background-color: #2980b9;
    }

    #texto {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🧠 Atividade 5 - JavaScript</h1>

  <button onclick="mostrarAlerta()">Mostrar Alerta</button>
  <button onclick="mostrarMensagem('Mensagem com argumento!')">Mostrar Mensagem com Argumento</button>

  <input type="number" id="valor1" placeholder="Valor 1">
  <input type="number" id="valor2" placeholder="Valor 2">
  <button onclick="somarValoresPersonalizados()">Somar Valores Digitados</button>

  <button onclick="escreveTexto()">Escrever Texto na Página</button>
  <button onclick="limparTexto()">Limpar Texto</button>
  <button onclick="excluirAlerta()">Excluir Alerta (Simulado)</button>

  <div id="texto"></div>

  <script>
    function mostrarAlerta() {
      alert('Esta é uma mensagem de alerta!');
    }

    function mostrarMensagem(mensagem) {
      alert('Mensagem: ' + mensagem);
    }

    function somarValoresPersonalizados() {
      const v1 = parseFloat(document.getElementById("valor1").value);
      const v2 = parseFloat(document.getElementById("valor2").value);
      if (isNaN(v1) || isNaN(v2)) {
        alert("Digite dois números válidos.");
        return;
      }
      alert("A soma é: " + (v1 + v2));
    }

    function escreveTexto() {
      document.getElementById("texto").innerText = "Texto gerado pela função.";
    }

    function limparTexto() {
      document.getElementById("texto").innerText = "";
    }

    function excluirAlerta() {
      document.getElementById("texto").innerText = "Alerta excluído com sucesso!";
    }
  </script>
</body>
</html>
