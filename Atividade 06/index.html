<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atividade 6 - JavaScript Separado</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f0f2f5;
      padding: 40px;
      max-width: 600px;
      margin: auto;
    }

    h1 {
      color: #2c3e50;
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    section {
      margin-bottom: 30px;
    }

    button {
      padding: 10px 16px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background-color: #3498db;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #2980b9;
    }

    input {
      padding: 10px;
      width: 100%;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    p, div {
      margin-top: 10px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <section>
    <h1>🔢 Raiz Quadrada</h1>
    <button onclick="calcularRaiz(25)">Raiz de 25</button>
    <button onclick="calcularRaiz(36)">Raiz de 36</button>
    <button onclick="calcularRaiz(49)">Raiz de 49</button>
    <p id="resultado"></p>
  </section>

  <section>
    <h1>📝 Escrever em uma Div</h1>
    <div id="minhaDiv"></div>
    <button onclick="escreverNaDiv()">Escrever</button>
  </section>

  <section>
    <h1>💬 Receber Texto</h1>
    <input type="text" id="textoUsuario" placeholder="Digite algo">
    <button onclick="receberTexto()">Enviar</button>
    <p id="textoResultado"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
