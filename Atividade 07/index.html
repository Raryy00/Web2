<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desafio 01 - Escrever Números</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .container {
      background-color: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      color: #2c3e50;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background-color: #3498db;
      color: white;
      cursor: pointer;
      margin: 5px;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #2980b9;
    }

    .number {
      display: inline-block;
      background-color: #ecf0f1;
      margin: 4px;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 500;
    }

    #output {
      margin-top: 20px;
    }

    .error {
      color: #e74c3c;
      font-weight: 500;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Desafio 01: Escrever Números</h1>
    <input type="number" id="numeroInput" placeholder="Digite um número positivo" />
    <button onclick="escreverNumeros()">Escrever Números</button>
    <button onclick="limparNumeros()">Limpar</button>
    <div id="output"></div>
    <p id="mensagemErro" class="error"></p>
  </div>

  <script>
    function escreverNumeros() {
      const n = parseInt(document.getElementById("numeroInput").value);
      const outputDiv = document.getElementById("output");
      const erro = document.getElementById("mensagemErro");
      outputDiv.innerHTML = "";
      erro.innerText = "";

      if (isNaN(n) || n <= 0) {
        erro.innerText = "Por favor, digite um número válido maior que zero.";
        return;
      }

      for (let i = 1; i <= n; i++) {
        const span = document.createElement("span");
        span.className = "number";
        span.innerText = i;
        outputDiv.appendChild(span);
      }
    }

    function limparNumeros() {
      document.getElementById("output").innerHTML = "";
      document.getElementById("mensagemErro").innerText = "";
      document.getElementById("numeroInput").value = "";
    }
  </script>
</body>
</html>
