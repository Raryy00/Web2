<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atividade 8 - Manipulação de Arrays</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f6f8;
      padding: 40px 20px;
      max-width: 800px;
      margin: auto;
    }

    h1 {
      color: #2c3e50;
      font-size: 1.6rem;
      margin-bottom: 10px;
    }

    section {
      margin-bottom: 40px;
    }

    button {
      padding: 10px 16px;
      margin: 5px 0;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background-color: #3498db;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #2980b9;
    }

    input {
      padding: 10px;
      margin: 5px 0;
      width: 100%;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    .output {
      margin-top: 10px;
      padding: 10px;
      background-color: #ecf0f1;
      border-radius: 8px;
    }

    hr {
      margin: 40px 0;
      border: none;
      border-top: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <section>
    <h1>🧠 Array de Linguagens</h1>
    <button onclick="mostrarListaLinguagens()">Mostrar Lista</button>
    <input type="text" id="novaLinguagem" placeholder="Adicionar nova linguagem">
    <button onclick="adicionarLinguagem()">Adicionar Linguagem</button>
    <input type="number" id="indiceLinguagem" placeholder="Consultar posição">
    <button onclick="posicaoLinguagens()">Consultar Linguagem</button>
    <input type="number" id="removerLinguagem" placeholder="Remover por índice">
    <button onclick="removerLinguagem()">Remover Linguagem</button>
    <button onclick="limparListaLinguagens()">Limpar Lista</button>
    <div id="minhaDiv" class="output"></div>
  </section>

  <hr>

  <section>
    <h1>🍓 Array de Frutas</h1>
    <button onclick="mostrarListaFrutas()">Mostrar Lista</button>
    <input type="text" id="novaFruta" placeholder="Adicionar nova fruta">
    <button onclick="adicionarFruta()">Adicionar Fruta</button>
    <input type="number" id="indiceFruta" placeholder="Consultar posição">
    <button onclick="posicaoFrutas()">Consultar Fruta</button>
    <input type="number" id="removerFruta" placeholder="Remover por índice">
    <button onclick="removerFruta()">Remover Fruta</button>
    <button onclick="limparListaFrutas()">Limpar Lista</button>
    <div id="minhaDivFrutas" class="output"></div>
  </section>

  <script>
    let linguagens = ['Dart', 'PHP', 'Java', 'Python', 'Perl', 'Ruby on Rails', 'C++'];
    let frutas = ['Maçã', 'Banana', 'Laranja', 'Manga', 'Uva', 'Abacaxi', 'Morango'];

    function mostrarListaLinguagens() {
      const container = document.getElementById("minhaDiv");
      container.innerHTML = linguagens.map((lang, i) => `<p>${i} - ${lang}</p>`).join('');
    }

    function posicaoLinguagens() {
      const indice = parseInt(document.getElementById("indiceLinguagem").value);
      if (isNaN(indice) || indice < 0 || indice >= linguagens.length) {
        alert("Índice inválido.");
        return;
      }
      alert(`Linguagem na posição ${indice}: ${linguagens[indice]}`);
    }

    function adicionarLinguagem() {
      const nova = document.getElementById("novaLinguagem").value;
      if (nova) {
        linguagens.push(nova);
        mostrarListaLinguagens();
        document.getElementById("novaLinguagem").value = "";
      }
    }

    function removerLinguagem() {
      const indice = parseInt(document.getElementById("removerLinguagem").value);
      if (!isNaN(indice) && indice >= 0 && indice < linguagens.length) {
        linguagens.splice(indice, 1);
        mostrarListaLinguagens();
      } else {
        alert("Índice inválido.");
      }
    }

    function limparListaLinguagens() {
      document.getElementById("minhaDiv").innerHTML = '';
    }

    function mostrarListaFrutas() {
      const container = document.getElementById("minhaDivFrutas");
      container.innerHTML = frutas.map((fruta, i) => `<p>${i} - ${fruta}</p>`).join('');
    }

    function posicaoFrutas() {
      const indice = parseInt(document.getElementById("indiceFruta").value);
      if (isNaN(indice) || indice < 0 || indice >= frutas.length) {
        alert("Índice inválido.");
        return;
      }
      alert(`Fruta na posição ${indice}: ${frutas[indice]}`);
    }

    function adicionarFruta() {
      const nova = document.getElementById("novaFruta").value;
      if (nova) {
        frutas.push(nova);
        mostrarListaFrutas();
        document.getElementById("novaFruta").value = "";
      }
    }

    function removerFruta() {
      const indice = parseInt(document.getElementById("removerFruta").value);
      if (!isNaN(indice) && indice >= 0 && indice < frutas.length) {
        frutas.splice(indice, 1);
        mostrarListaFrutas();
      } else {
        alert("Índice inválido.");
      }
    }

    function limparListaFrutas() {
      document.getElementById("minhaDivFrutas").innerHTML = '';
    }
  </script>
</body>
</html>
